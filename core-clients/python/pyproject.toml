[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramen-ai-core"
dynamic = ["version"]
description = "Synchronous Python client for the ramen-ai API with local Ed25519 V5 receipt verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
license-files = ["LICENSE"]
keywords = ["ramen-ai", "ai-governance", "policy", "receipts", "ed25519"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
]

[project.urls]
Homepage = "https://ramenai.dev"
Repository = "https://github.com/ramen-ai-dev/ramen-ai-integrations"
Documentation = "https://ramenai.dev/llms.txt"

[tool.hatch.version]
path = "ramen_ai/_version.py"

[tool.hatch.build.targets.sdist]
include = ["ramen_ai", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["ramen_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
