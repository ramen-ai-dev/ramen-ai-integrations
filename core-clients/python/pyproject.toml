[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramen-ai-core"
version = "0.2.2"
description = "Synchronous Python client for the ramen-ai API with local Ed25519 V5 receipt verification."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ramen_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
