name: Test ramen-ai PR Compliance Action

# Self-test: run the locally-built action against every pull request so we can
# empirically confirm it intercepts non-compliant diffs.
on: [pull_request]

jobs:
  compliance:
    runs-on: ubuntu-latest
    # Permissions must be at job level — a workflow-level block is not
    # sufficient on organisations with restrictive default token settings.
    permissions:
      contents: read        # required: list changed files in the PR
      pull-requests: write  # required: list PR files + post verdict comment
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ramen-ai PR Compliance Interceptor
        uses: ./plugins/github-action
        with:
          ramen_api_key: ${{ secrets.RAMEN_API_KEY }}
          bundle_ids: "ramen__shield_core_it"
          github_token: ${{ secrets.GITHUB_TOKEN }}
