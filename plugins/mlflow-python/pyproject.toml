[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramen-mlflow-guard"
version = "0.1.0"
description = "ramen-ai algorithmic governance for MLflow models. Wraps a pyfunc model, evaluates feature arrays for proxy bias and regulatory compliance pre-inference, and halts serving on a BLOCKED verdict."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "mlflow>=2.9.0",
    "ramen-ai-core",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-httpx>=0.30.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_mlflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
