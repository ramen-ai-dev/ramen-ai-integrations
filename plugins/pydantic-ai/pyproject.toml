[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramen-ai-pydantic"
version = "0.1.0"
description = "ramen-ai L2 Semantic Firewall — PydanticAI args_validator middleware. Intercepts tool calls pre-execution and halts the agent on a BLOCKED compliance verdict."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pydantic-ai>=0.0.14",
    "ramen-ai-core",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ramen_pydantic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
