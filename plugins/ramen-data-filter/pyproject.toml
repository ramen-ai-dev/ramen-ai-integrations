[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ramen-data-filter"
version = "0.1.1"
description = "Dual-mode Pandas and CSV filtration for ramen-ai RAG ingestion and MLOps dataset sanitization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "pandas==2.3.3",
    "ramen-ai-core==0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ramen_data_filter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
