[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ramen-ai-langchain"
version = "0.1.0"
description = "ramen-ai L2 Semantic Firewall — LangChain callback handler. Intercepts tool calls pre-execution and halts the chain on a BLOCKED compliance verdict."
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "langchain-core>=0.2.0",
    "ramen-ai-core",
    "httpx>=0.27.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["ramen_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]
