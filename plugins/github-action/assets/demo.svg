<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="680" height="260">
  <defs>
    <style>
      .window  { fill: #1a1a2e; rx: 10; }
      .titlebar{ fill: #2d2d3f; }
      .dot-r   { fill: #ff5f57; }
      .dot-y   { fill: #ffbd2e; }
      .dot-g   { fill: #28ca42; }
      .label   { fill: #8b8fa8; font: 500 11px/1 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .prompt  { fill: #6272a4; font: 400 13px/1 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .text    { fill: #cdd6f4; font: 400 13px/1.6 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .key     { fill: #89b4fa; font: 400 13px/1.6 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .blocked { fill: #f38ba8; font: 700 13px/1.6 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .allowed { fill: #a6e3a1; font: 700 13px/1.6 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .audit   { fill: #89dceb; font: 400 13px/1.6 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
      .dim     { fill: #585b70; font: 400 13px/1.6 ui-monospace, 'Cascadia Code', 'Fira Mono', monospace; }
    </style>
  </defs>

  <!-- Window chrome -->
  <rect width="680" height="260" rx="10" fill="#1a1a2e"/>
  <rect width="680" height="36" rx="10" fill="#2d2d3f"/>
  <rect y="26" width="680" height="10" fill="#2d2d3f"/>

  <!-- Traffic lights -->
  <circle cx="20" cy="18" r="6" class="dot-r"/>
  <circle cx="40" cy="18" r="6" class="dot-y"/>
  <circle cx="60" cy="18" r="6" class="dot-g"/>

  <!-- Title -->
  <text x="340" y="22" text-anchor="middle" class="label">ramen-ai — PR Compliance Interceptor</text>

  <!-- Terminal content — line 1: scanning -->
  <text x="22" y="68" class="prompt">❯ </text>
  <text x="42" y="68" class="text">ramen-ai scan --pr 1 --bundle ramen__shield_core_it</text>

  <text x="22" y="94" class="dim">  Scanning PR #1 in </text>
  <text x="176" y="94" class="key">ramen-noodle6/Fragen-die-verbinden</text>
  <text x="378" y="94" class="dim"> ...</text>

  <text x="22" y="116" class="dim">  Evaluating </text>
  <text x="110" y="116" class="key">tests/agent_prompt.md</text>
  <text x="266" y="116" class="dim"> against </text>
  <text x="330" y="116" class="key">ramen__shield_core_it</text>
  <text x="510" y="116" class="dim"> (5 policies)</text>

  <!-- Line 2: BLOCKED verdict -->
  <text x="22" y="148">
    <tspan class="blocked">  [BLOCKED]</tspan>
    <tspan class="text"> Violation: Unauthorized financial transfer detected.</tspan>
  </text>
  <text x="22" y="168" class="dim">           Anchor: </text>
  <text x="117" y="168" class="key">OWASP ASI-06 · IT Destructive Execution Firewall</text>
  <text x="22" y="188" class="dim">           Steering: </text>
  <text x="127" y="188" class="text">Refuse the transfer and escalate to human review.</text>

  <!-- Line 3: receipt -->
  <text x="22" y="216">
    <tspan class="audit">  [AUDIT]</tspan>
    <tspan class="text"> Receipt verified (Ed25519) · kid: </tspan>
    <tspan class="key">ramen_pk_v1</tspan>
  </text>
  <text x="22" y="236" class="dim">          sig: </text>
  <text x="80" y="236" class="dim">Ed25519(sha256:a3f9c2e8…) · schema: 5.0</text>

  <!-- Bottom border glow -->
  <rect x="0" y="248" width="680" height="12" rx="10" fill="#1a1a2e"/>
</svg>
